name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ml + backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ml/pyproject.toml
            backend/pyproject.toml
      - run: pip install -e "ml[dev]" -e "backend[dev]"
      - name: ml tests
        run: pytest
        working-directory: ml
      - name: backend tests
        run: pytest
        working-directory: backend

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  no-secrets:
    name: No API key committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a Bedrock API key or a .env file is in the tree
        run: |
          if git grep -nIE 'ABSK[A-Za-z0-9+/=]{40,}' -- . ; then
            echo "::error::An API key is committed. Remove it and rotate the key."
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' ; then
            echo "::error::A .env file is committed."
            exit 1
          fi
